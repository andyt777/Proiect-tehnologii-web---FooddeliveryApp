<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Savoro: cina ta preferată, la ușă. Alege din meniul restaurantelor și urmărește-ți comenzile." />
    <meta name="theme-color" content="#133A2B" /><!-- bara browserului în verdele de pădure al antetului -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23133A2B'/%3E%3Cpath d='M7 16.5h18a9 9 0 0 1-18 0Z' fill='%23F5EFE2'/%3E%3Cpath d='M18.5 5.5c-2.2 1.1-2.2 3 0 4.1s2.2 3 0 4.1M13 7.5c-1.4.7-1.4 1.9 0 2.6s1.4 1.9 0 2.6' stroke='%23F5EFE2' stroke-width='1.8' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" /><!-- favicon-ul: semnul Savoro, crem pe cercul verde #133A2B -->
    <link rel="preconnect" href="https://fonts.googleapis.com" /><!-- conexiunea la Google Fonts pornește devreme -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><!-- serverul fișierelor de font -->
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;600;800&display=swap" rel="stylesheet" /><!-- Gabarito, o singură familie fără serife: 400 text, 600 etichete, 800 titluri; subsetul latin-ext are ș ț ă î â -->
    <!-- Fotografia mare din hero (pizza, portret) se cere înaintea CSS-ului și a JS-ului: e primul lucru vizibil pe „/” -->
    <link rel="preload" as="image" href="/img/hero-900.webp" type="image/webp" fetchpriority="high" /><!-- aceeași fotografie pe telefon și pe desktop -->
    <title>Savoro</title>
    <!-- Tema aleasă data trecută se pune pe <html> înainte de prima desenare, ca pagina să nu clipească -->
    <script>
      try {
        const tema = localStorage.getItem("tema");
        if (tema === "light" || tema === "dark") document.documentElement.dataset.theme = tema;
      } catch {
        // fără localStorage: rămâne tema sistemului
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
