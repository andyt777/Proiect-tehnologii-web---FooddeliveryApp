<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Savoro: toate comenzile tale de mâncare, într-un singur loc." />
    <meta name="theme-color" content="#2a1a12" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23c2410c'/%3E%3Cpath d='M7 16.5h18a9 9 0 0 1-18 0Z' fill='white'/%3E%3Cpath d='M18.5 5.5c-2.2 1.1-2.2 3 0 4.1s2.2 3 0 4.1M13 7.5c-1.4.7-1.4 1.9 0 2.6s1.4 1.9 0 2.6' stroke='white' stroke-width='1.8' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Savoro</title>
    <!-- Tema aleasă data trecută se pune pe <html> înainte de prima desenare, ca pagina să nu clipească -->
    <script>
      try {
        const tema = localStorage.getItem("tema");
        if (tema === "light" || tema === "dark") document.documentElement.dataset.theme = tema;
      } catch {
        // fără localStorage: rămâne tema sistemului
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
